[package]
name = "aura-core"
version = "0.0.1"
edition = "2021"
authors = ["exyreams@gmail.com"]
description = "AURA autonomous treasury program for Solana - encrypted guardrails and dWallet execution"
documentation = "https://docs.rs/aura-core"
homepage = "https://github.com/exyreams/aura"
repository = "https://github.com/exyreams/aura"
license = "MIT"
keywords = ["solana", "anchor", "treasury", "fhe", "dwallet"]
categories = ["cryptography"]
publish = false

[lib]
name = "aura_core"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = "1.0.0"
aura-policy = { path = "../aura-policy" }
bs58 = "0.5"
encrypt-anchor = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-dsl = { package = "encrypt-solana-dsl", git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-solana-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"

