[package]
name = "aura-policy"
version = "0.0.1"
edition = "2021"
authors = ["exyreams@gmail.com"]
description = "Policy engine for AURA autonomous treasury - FHE graphs and rule evaluation"
documentation = "https://docs.rs/aura-policy"
homepage = "https://github.com/exyreams/aura"
repository = "https://github.com/exyreams/aura"
license = "MIT"
keywords = ["solana", "policy", "fhe", "treasury", "encryption"]
categories = ["cryptography", "no-std"]
publish = false

[lib]
name = "aura_policy"
path = "src/lib.rs"

[dependencies]
encrypt-dsl = { package = "encrypt-solana-dsl", git = "https://github.com/dwallet-labs/encrypt-pre-alpha", rev = "7ac351b559a8e09c76665335fa24fa973675efb3" }
encrypt-solana-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha", rev = "7ac351b559a8e09c76665335fa24fa973675efb3" }
encrypt-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha", rev = "7ac351b559a8e09c76665335fa24fa973675efb3" }
sha2 = "0.10"
