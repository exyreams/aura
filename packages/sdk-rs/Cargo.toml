[package]
name = "aura-sdk"
version = "0.2.1"
edition = "2021"
authors = ["exyreams@gmail.com"]
description = "Rust SDK for the AURA autonomous treasury program on Solana"
documentation = "https://docs.rs/aura-sdk"
homepage = "https://github.com/exyreams/aura"
repository = "https://github.com/exyreams/aura"
license = "MIT"
readme = "README.md"
keywords = ["solana", "anchor", "treasury", "fhe", "dwallet"]
categories = ["cryptography", "api-bindings"]
exclude = [".gitignore"]
publish = false

[dependencies]
anchor-lang = "1.0.0"
aura-core = { path = "../../programs/aura-core", features = ["cpi"] }
aura-policy = { path = "../../programs/aura-policy" }
constant_time_eq = "=0.4.2"
solana-client = "=3.1.12"
solana-commitment-config = "=3.1.1"
solana-sdk = "=3.0.0"
thiserror = "2.0.18"
