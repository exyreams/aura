name: aura

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-backend
    container_name: aura-backend
    env_file:
      - .env
    environment:
      AURA_DATABASE_PATH: /app/data/aura.db
    ports:
      - "8787:8787"
    restart: unless-stopped
    volumes:
      - aura-backend-data:/app/data

volumes:
  aura-backend-data:
