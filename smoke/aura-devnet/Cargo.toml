[package]
name = "aura-devnet"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[[bin]]
name = "dwallet"
path = "src/bin/dwallet.rs"

[[bin]]
name = "confidential"
path = "src/bin/confidential.rs"

[[bin]]
name = "policy"
path = "src/bin/policy.rs"

[[bin]]
name = "admin"
path = "src/bin/admin.rs"

[[bin]]
name = "wallet"
path = "src/bin/wallet.rs"

[[bin]]
name = "hardening"
path = "src/bin/hardening.rs"

[[bin]]
name = "oracle_multichain"
path = "src/bin/oracle_multichain.rs"

[[bin]]
name = "recovery"
path = "src/bin/recovery.rs"

[[bin]]
name = "trust_identity"
path = "src/bin/trust_identity.rs"

[[bin]]
name = "versioning_monetization"
path = "src/bin/versioning_monetization.rs"

[[bin]]
name = "monetization"
path = "src/bin/monetization.rs"

[[bin]]
name = "confidential_lifecycle"
path = "src/bin/confidential_lifecycle.rs"

[[bin]]
name = "confidential_batch"
path = "src/bin/confidential_batch.rs"

[dependencies]
anyhow = "1"
anchor-lang = "1.0.0"
borsh = "1.6"
dirs-next = "2"
aura-core = { path = "../../programs/aura-core", features = ["cpi"] }
aura-policy = { path = "../../programs/aura-policy" }
bcs = "0.2"
bs58 = "0.5"
encrypt-compute = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-grpc = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
encrypt-types = { git = "https://github.com/dwallet-labs/encrypt-pre-alpha" }
hex = "0.4"
ika-dwallet-types = { git = "https://github.com/dwallet-labs/ika-pre-alpha" }
ika-grpc = { git = "https://github.com/dwallet-labs/ika-pre-alpha" }
solana-client = "3.1"
solana-commitment-config = "3.1"
solana-sdk = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots", "transport"] }

[patch."https://github.com/dwallet-labs/encrypt-pre-alpha"]
encrypt-grpc = { path = "../vendor/encrypt-grpc" }

[patch."https://github.com/dwallet-labs/ika-pre-alpha"]
ika-grpc = { path = "../vendor/ika-grpc" }
